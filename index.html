<style>

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ui); overflow: hidden; padding-inline: 16px; -webkit-font-smoothing: antialiased; }

<script>

}
function updateUI() {
  fill.style.width = (t / END * 100) + '%';
  if (++uiTick % 10 === 0) { timeEl.textContent = fmt(t) + ' / ' + fmt(END); track.setAttribute('aria-valuenow', Math.floor(t)); }
  const line = lineAt(t);
  if (line !== curLine) { curLine = line; subEl.classList.remove('on'); clearTimeout(lineTimer); if (line) lineTimer = setTimeout(() => { subEl.textContent = line; subEl.classList.add('on'); }, 420); }
  const i = chapterAt(t), cn = started && t < FILM_END - 1 ? CH[i].name : '';
  if (cn !== curChap) { curChap = cn; chapEl.classList.remove('on'); clearTimeout(chapTimer); if (cn) chapTimer = setTimeout(() => { chapEl.innerHTML = '<span>' + String(i + 1).padStart(2, '0') + '</span>' + cn; chapEl.classList.add('on'); }, 600); }
  finalEl.classList.toggle('on', started && t >= FINAL_T);
  const showEnd = started && t >= END_CARD;
  if (endCard.hidden === showEnd) endCard.hidden = !showEnd;
  mixAudio(t);
}

/* ================= frame loop ================= */
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  if (W * H * DPR * DPR > 4.2e6) DPR = Math.max(1, Math.sqrt(4.2e6 / (W * H)));
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  K = Math.min(W / FW, H / FH); OX = (W - FW * K) / 2; OY = (H - FH * K) / 2; RS = DPR * K;
  fibrePat = mainCtx.createPattern(fibreTex, 'repeat'); grainPat = mainCtx.createPattern(grainTex, 'repeat');
  layoutText();
}
let contactDone = false;
function paint() {
  const contact = location.hash === '#contact';
  if (contact && contactDone) return;
  contactDone = contact;
  mainCtx.setTransform(1, 0, 0, 1, 0, 0); mainCtx.globalAlpha = 1; mainCtx.globalCompositeOperation = 'source-over';
  mainCtx.fillStyle = '#000'; mainCtx.fillRect(0, 0, cvs.width, cvs.height);
  if (contact) {
    const times = [1.6, 3.2, 8.5, 13, 16, 24, 33, 36, 44.5, 48, 53, 58.5, 63, 69.5, 74, 76.5, 82, 88, 95, 100, 105.5, 110, 116, 120.5], cols = 6, kk = Math.min(W / cols / FW, H / 4 / FH);
    times.forEach((tt, n) => renderAt(tt, (n % cols) * FW * kk, Math.floor(n / cols) * FH * kk, kk));
    return;
  }
  renderAt(started ? t : 9.6, OX, OY, K);
}
addEventListener('resize', resize);
addEventListener('hashchange', paint);
resize(); paintButtons();
let last = performance.now(), slow = 0;
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing) { const prev = t; t = Math.min(END, t + dt); fireSfx(prev, t); if (t >= END) setPlaying(false); }
  const t0 = performance.now();
  paint();
  const cost = performance.now() - t0;
  slow = cost > 34 ? slow + 1 : Math.max(0, slow - 1);
  if (slow > 45 && dprCap > 1) { dprCap = 1; slow = 0; resize(); }
  else if (slow > 45 && !LITE) { LITE = true; slow = 0; }
  updateUI();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
